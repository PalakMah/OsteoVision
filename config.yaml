# Configuration for the osteoporosis knee X-ray classification pipeline
# Mirrors the CONFIG dict defined in notebooks/osteoporosis.ipynb.
# Update `root` to point at your local copy of the dataset before running.

data:
  root: "data/Osteoporosis Knee X-ray"   # path to the raw image dataset (not tracked in git)
  image_extensions: [".png", ".jpg", ".jpeg", ".bmp", ".tif", ".tiff"]
  label_map:
    normal: 0
    osteopenia: 1
    osteoporosis: 2

training:
  img_size: 224
  batch_size: 16
  n_folds: 5
  epochs: 30
  patience: 7
  lr: 3.0e-4
  weight_decay: 1.0e-4
  focal_gamma: 2.0
  embed_dim: 128
  seed: 42

output:
  dir: "results"

llm:
  # Set the ANTHROPIC_API_KEY environment variable to enable live narrated
  # explanations. If unset, the notebook falls back to an offline template.
  model: "claude-sonnet-4-6"
